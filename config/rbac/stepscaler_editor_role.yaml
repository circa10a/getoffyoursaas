# This rule is not used by the project getoffyoursaas itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the getoffyoursaas.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: getoffyoursaas
    app.kubernetes.io/managed-by: kustomize
  name: stepscaler-editor-role
rules:
- apiGroups:
  - getoffyoursaas.io
  resources:
  - stepscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - getoffyoursaas.io
  resources:
  - stepscalers/status
  verbs:
  - get

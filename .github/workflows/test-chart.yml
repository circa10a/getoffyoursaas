#            --timeout 300s

# TODO: Uncomment if Prometheus is enabled
#      - name: Install Prometheus Operator CRDs
#        run: |
#          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#          helm repo update
#          helm install prometheus-crds prometheus-community/prometheus-operator-crds

      # The manager watches VerticalPodAutoscaler, so without this CRD its cache
      # sync fails and the process exits. helm-deploy uses --wait, so the job
      # would hang until timeout. Only the CRD is needed here; the VPA
      # controllers themselves are not exercised by a chart-install smoke test.
      - name: Install VPA CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.7.1/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml

      - name: Deploy manager via Helm
        run: |
          make helm-deploy

      - name: Check Helm release status
        run: |
          make helm-status

              currentCPU:
                anyOf:
                - type: integer
                - type: string
                description: CurrentCPU is the floor most recently written to the
                  owned VPA.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              steps:
